<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제46회 네이버 볼링 동호회 서울 전국대회 · QR 안내문</title>
  <meta name="description" content="회원 조회 화면 QR 코드 안내문. 카메라로 찍으면 실시간 점수·레인 배정·순위 화면이 열립니다.">
  <meta property="og:title" content="제46회 네이버 볼링 동호회 서울 전국대회 · QR 안내문">
  <meta property="og:image" content="https://naverbowlfesta.netlify.app/qr.png">
  <link rel="icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 15mm; }
    :root { --navy: #1E2537; --orange: #FF5A2E; --paper: #F5F2EA; --text-2: #555; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--navy); font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: #fff; border-bottom: 1px solid #e3ded2; font-size: 13px; }
    .toolbar a, .toolbar button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 10px; border: 1px solid #d6d0c2; background: #fff; color: var(--navy); text-decoration: none; cursor: pointer; }
    .toolbar .primary { background: var(--orange); border-color: var(--orange); color: #fff; }
    .toolbar .sp { flex: 1; }
    .sheet { max-width: 720px; margin: 24px auto; background: #fff; border-radius: 16px; padding: 48px 32px; text-align: center; box-shadow: 0 2px 14px rgba(0,0,0,.06); }
    h1 { font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif; font-weight: 400; font-size: 34px; line-height: 1.25; margin: 0 0 6px; }
    .sub { font-size: 16px; color: var(--text-2); margin-bottom: 28px; }
    .qr { width: min(72vw, 360px); height: auto; margin: 0 auto; display: block; }
    .url { font-size: 20px; font-weight: 700; margin-top: 24px; word-break: break-all; }
    .url a { color: var(--navy); text-decoration: none; border-bottom: 2px solid var(--orange); }
    .how { font-size: 14px; color: var(--text-2); margin-top: 14px; line-height: 1.8; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; text-align: left; }
    .step { background: var(--paper); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; }
    .step b { display: block; color: var(--orange); font-size: 12px; margin-bottom: 2px; }
    @media (max-width: 520px) { .steps { grid-template-columns: 1fr; } h1 { font-size: 27px; } .sheet { padding: 32px 20px; margin: 12px; } }
    @media print { body { background: #fff; } .toolbar { display: none; } .sheet { box-shadow: none; border-radius: 0; max-width: none; margin: 0; padding: 10mm 0 0; } .qr { width: 110mm; } h1 { font-size: 30px; } }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="./">← 홈으로</a>
    <span class="sp"></span>
    <a class="primary" href="qr-poster.pdf" download="naverbowlfesta-qr.pdf">PDF 내려받기</a>
    <a href="qr.png" download="naverbowlfesta-qr.png">QR 이미지(PNG)</a>
    <button type="button" onclick="window.print()">인쇄</button>
  </div>
  <div class="sheet">
    <h1>제46회 네이버 볼링 동호회<br>서울 전국대회</h1>
    <div class="sub">실시간 점수 · 레인 배정 · 순위 조회</div>
    <img class="qr" src="qr.svg" alt="회원 조회 화면 QR 코드" width="360" height="360">
    <div class="url"><a href="https://naverbowlfesta.netlify.app/">naverbowlfesta.netlify.app</a></div>
    <div class="how">카메라로 QR을 찍으면 바로 열립니다. 로그인 없이 이름으로 검색하세요.</div>
    <div class="steps">
      <div class="step"><b>1. 검색</b>이름을 입력하면 내 조·레인·핸디·참가 종목이 나옵니다.</div>
      <div class="step"><b>2. 배정</b>조별·스카치·베이커 레인 배정을 확인합니다.</div>
      <div class="step"><b>3. 순위</b>개인전·팀·지역 종합 순위와 전체 기록을 실시간으로 봅니다.</div>
    </div>
  </div>
</body>
</html>
