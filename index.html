<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎳 전국대회 관리</title>
  <link rel="stylesheet" href="css/style.css?v=1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎳</text></svg>">
</head>
<body>
  <!-- 관리자 로그인 (모달) -->
  <div id="admin-modal" class="modal" style="display:none;">
    <form id="admin-form" class="modal-box" autocomplete="off">
      <h2>🔐 관리자 로그인</h2>
      <input type="password" id="admin-pin" placeholder="관리자 PIN" inputmode="numeric" maxlength="6" required>
      <p id="admin-error" class="form-error"></p>
      <div class="row"><button class="btn btn-primary" type="submit">로그인</button><button class="btn btn-outline" type="button" id="admin-cancel">취소</button></div>
      <p id="admin-hint" class="muted small mt"></p>
      <button class="link-btn dark" id="btn-server" type="button">⚙ 서버 연결 설정</button>
    </form>
  </div>

  <div id="app-wrap">
    <header>
      <div class="header-inner">
        <div>
          <h1 id="header-org">🎳 전국 볼링 클럽 연합</h1>
          <p class="subtitle">전국대회 관리 시스템</p>
        </div>
        <div class="header-right">
          <span id="mode-badge" class="mode-badge"></span>
          <button id="btn-admin" class="btn btn-xs btn-outline">🔐 관리자</button>
          <button id="btn-logout" class="btn btn-xs btn-outline" style="display:none;">로그아웃</button>
        </div>
      </div>
    </header>

    <nav class="tabs" id="main-tabs">
      <button class="tab-btn active" data-tab="home">🏠 홈</button>
      <button class="tab-btn" data-tab="tournaments">🏆 대회</button>
      <button class="tab-btn" data-tab="player">👤 선수 조회</button>
      <button class="tab-btn" data-tab="clubs">🏢 클럽</button>
      <button class="tab-btn" data-tab="members">👥 회원</button>
      <button class="tab-btn" data-tab="season">📈 시즌랭킹</button>
      <button class="tab-btn" data-tab="settings" data-role="admin">⚙️ 설정</button>
    </nav>

    <main>
      <section id="tab-home" class="tab-content active"></section>
      <section id="tab-tournaments" class="tab-content"></section>
      <section id="tab-player" class="tab-content"></section>
      <section id="tab-clubs" class="tab-content"></section>
      <section id="tab-members" class="tab-content"></section>
      <section id="tab-season" class="tab-content"></section>
      <section id="tab-settings" class="tab-content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="loading" class="loading" style="display:none;"><div class="spinner"></div></div>

  <script src="js/ranking.js?v=1"></script>
  <script src="js/sample-data.js?v=1"></script>
  <script src="js/store.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
